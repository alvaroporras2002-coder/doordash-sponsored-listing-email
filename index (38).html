<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DoorDash Sponsored Listings for restaurant merchants.">
  <title>DoorDash Sponsored Listings</title>
  <style>
    :root { --dd-red:#eb1700; --ink:#111111; --bg:#f7f7f5; --card:#ffffff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width:920px; margin:0 auto; padding:32px 18px 52px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.02em; margin-bottom:24px; }
    .mark { width:24px; height:18px; background:var(--dd-red); border-radius:3px 12px 3px 12px; display:inline-block; transform:skewX(-18deg); }
    .hero { background:var(--card); border-radius:24px; padding:18px; box-shadow:0 14px 40px rgba(0,0,0,.08); }
    video { display:block; width:100%; height:auto; border-radius:18px; background:#000; }
    h1 { font-size:clamp(30px,6vw,58px); line-height:.98; margin:26px 0 14px; letter-spacing:-.04em; }
    p { font-size:18px; line-height:1.55; margin:0 0 20px; color:#444; }
    .btn { display:inline-block; background:var(--dd-red); color:white; text-decoration:none; font-weight:800; padding:15px 22px; border-radius:999px; }
    .note { font-size:13px; color:#666; margin-top:16px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>DOORDASH</span></div>
    <section class="hero">
      <video autoplay muted playsinline loop poster="sponsored-listing-poster.jpg" preload="auto" controls>
        <source src="sponsored-listing.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
      <h1>Get more visibility on DoorDash.</h1>
      <p>Sponsored Listings can help put your restaurant in front of more customers while giving you control over your advertising campaign.</p>
      <a class="btn" href="YOUR_CTA_URL">Start your Sponsored Listing</a>
      <div class="note">Replace YOUR_CTA_URL with your Merchant Portal or booking link before publishing.</div>
    </section>
  </main>
</body>
</html>
