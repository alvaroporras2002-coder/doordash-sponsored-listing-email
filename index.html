D.dateKey=(iso,tz)=>{try{const date=iso instanceof Date?iso:new Date(iso);if(!Number.isFinite(date.getTime()))return '';const parts=new Intl.DateTimeFormat('en-CA',{timeZone:tz||D.state.settings.userTimezone||'America/Costa_Rica',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);return ['year','month','day'].map(k=>parts.find(p=>p.type===k)?.value).join('-');}catch{return '';}};

D.quality=m=>{const q=[];if(!String(m.storeName||'').trim())q.push('Missing store name');if(!m.storeId)q.push('Missing Store ID');if(!m.timezone)q.push('Missing timezone');else if(D.local(m).status==='Invalid timezone')q.push('Invalid timezone');if(!(m.emails||[]).some(D.validEmail)&&![...(m.phones||[]),m.mobilePhone,m.workPhone].some(p=>D.normalizePhone(p).length>=7&&!/do not use/i.test(p)))q.push('Missing contacts');if([m.dmName,...(m.emails||[]),...(m.phones||[]),m.mobilePhone,m.workPhone].some(v=>/do not use/i.test(v||'')))q.push('DO NOT USE contact');if(m.storeId&&D.active().filter(x=>String(x.storeId)===String(m.storeId)).length>1)q.push('Duplicate Store ID');return q;};
D.recentlyCalled=id=>{const m=D.merchant(id),today=D.today(),statusDate=/^\d{4}-\d{2}-\d{2}$/.test(m?.statusDate||'')?m.statusDate:D.dateKey(m?.statusDate);return (m?.status==='Called'&&statusDate>=D.addDays(today,-6)&&statusDate<=today)||D.callsFor(id).some(c=>{const diff=(Date.now()-new Date(c.timestamp).getTime())/86400000;return diff>=0&&diff<7;});};
D.classify=m=>{const status=m.status||'';if(/^(Blocked|Blocked \/ Data Issue)$/i.test(status))return 'Blocked / Data Issue';if(status==='Done')return 'Done';if(status==='Waiting on Merchant')return 'Waiting on Merchant';if(status==='Needs Data Review')return 'Needs Data Review';if(status==='Relationship / Healthy')return 'Relationship / Healthy';if(D.dueFollow(m.id).length||status==='Needs Follow-up')return 'Needs Follow-up';if(D.callsFor(m.id).some(c=>D.dateKey(c.timestamp)===D.today())||['Called','Called Today','Spoke','No Answer'].includes(status))return 'Called Today';if(D.quality(m).length)return 'Needs Data Review';if(m.photoCoverage!==null&&Number(m.photoCoverage)<50&&Number(m.gmv)>=5000)return 'High GMV + Critical Coverage';if(m.photoCoverage!==null&&Number(m.photoCoverage)>=80&&!m.promoOpp&&!m.slOpp)return 'Relationship / Healthy';return 'To Call';};
D.priority=m=>{let p=0;const due=D.dueFollow(m.id);if(due.length){const f=due[0];if(f.date<D.today())p+=10000+Math.max(0,Math.round((new Date(D.today()+'T12:00:00Z')-new Date(f.date+'T12:00:00Z'))/86400000))*80;else p+=9000;p+=({Critical:500,High:300,Medium:150,Low:50}[f.priority]||0);}else if(m.status==='Needs Follow-up')p+=8200;p+=m.photoCoverage===null||m.photoCoverage===undefined?700:(100-bounded(m.photoCoverage))*22;p+=Math.min((Number(m.gmv)||0)/3,2800);if(m.promoOpp)p+=420;if(m.slOpp)p+=420;if(D.quality(m).length)p-=850;if(!D.local(m).safe)p-=550;if(D.recentlyCalled(m.id)&&!due.length)p-=5000;if(['Done','Blocked / Data Issue'].includes(D.classify(m)))p-=10000;return p;};
D.insights=m=>{const calls=D.callsFor(m.id).length,followups=D.followFor(m.id).length,sales=D.state.sales.filter(s=>s.merchantId===m.id).length,credits=D.state.credits.filter(s=>s.merchantId===m.id).length,touchpoints=Math.min(100,(calls+followups)*16),health=bounded(Math.round(bounded(m.photoCoverage)*.36+bounded(m.descriptionCoverage)*.22+bounded(m.uptime)*.28+touchpoints*.14));return {health,opportunity:bounded(Math.round((100-health)*.68+(m.promoOpp?12:0)+(m.slOpp?12:0)+Math.min((Number(m.gmv)||0)/1200,20))),returnPotential:bounded(Math.round((Number(m.gmv)||0)/120+calls*6+sales*14+credits*8)),touchpoints};};

D.saveClocks=form=>{const v=D.readForm(form);try{new Intl.DateTimeFormat('en-US',{timeZone:v.userTimezone}).format(new Date());}catch{return D.toast('Enter a valid IANA timezone, such as America/Costa_Rica.','error');}if(!/^\d{2}:\d{2}$/.test(v.safeStart)||!/^\d{2}:\d{2}$/.test(v.safeEnd)||v.safeStart>=v.safeEnd)return D.toast('Safe call end must be later than start.','error');for(const key of ['minuteGoal','photoGoal','callGoal'])if(!Number.isFinite(Number(v[key]))||Number(v[key])<=0)return D.toast('Daily goals must be greater than zero.','error');if(v.outreachUrl&&!D.outreachUrl(v.outreachUrl))return D.toast('Outreach requires an HTTPS URL on sidebar.outreach.io or web.outreach.io.','error');for(const key of ['outreachUrl','dimeUrl'])if(v[key]&&!D.safeUrl(v[key]))return D.toast('Enter a valid HTTP or HTTPS '+key+' URL.','error');if(v.salesforceTemplate&&!D.safeUrl(v.salesforceTemplate.replace(/\{[^}]+\}/g,'example')))return D.toast('Salesforce template must be a valid HTTP or HTTPS URL.','error');Object.assign(D.state.settings,{userTimezone:v.userTimezone,safeStart:v.safeStart,safeEnd:v.safeEnd,minuteGoal:Number(v.minuteGoal),photoGoal:Number(v.photoGoal),callGoal:Number(v.callGoal),salesforceTemplate:v.salesforceTemplate.trim(),dimeUrl:v.dimeUrl.trim(),outreachUrl:v.outreachUrl.trim()});D.saveAndRender('Clock settings and goals saved.');};
async function extractColors(url){return new Promise(resolve=>{const im=new Image();im.onload=()=>{try{const can=document.createElement('canvas');can.width=40;can.height=40;const ctx=can.getContext('2d');ctx.drawImage(im,0,0,40,40);const data=ctx.getImageData(0,0,40,40).data,buckets=new Map();for(let i=0;i<data.length;i+=4){if(data[i+3]<128)continue;const r=Math.round(data[i]/32)*32,g=Math.round(data[i+1]/32)*32,b=Math.round(data[i+2]/32)*32;if(Math.max(r,g,b)-Math.min(r,g,b)<30||r+g+b<80||r+g+b>670)continue;const key=[r,g,b].map(v=>Math.min(v,255).toString(16).padStart(2,'0')).join('');buckets.set(key,(buckets.get(key)||0)+1);}resolve([...buckets].sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>'#'+k));}catch{resolve([]);}};im.onerror=()=>resolve([]);im.src=url;});}

D.exportWorkspace=()=>{const s=D.state;const data={exportType:'DASHWORK_PORTABLE_WORKSPACE',schemaVersion:D.SCHEMA_VERSION,appVersion:D.APP_VERSION,exportedAt:D.now(),summary:{merchants:s.merchants.length,activeMerchants:D.active().length,calls:s.calls.length,unmatched:s.unmatched.length,followups:s.followups.length,photos:s.photos.length,sales:s.sales.length,credits:s.credits.length,cases:s.cases.length,resources:s.resources.length,links:s.links.length},...clone(s)};D.download('dashwork-backup-'+D.today()+'.json',JSON.stringify(data,null,2),'application/json');};
D.importJSON=async file=>{if(!file)return;try{const data=JSON.parse(await file.text());let raw=data.state||data.data||data;if(raw?.collections)raw={...raw,...raw.collections};if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error('Workspace JSON must contain an object.');if(!Array.isArray(raw.merchants)&&!Array.isArray(raw.stores))throw new Error('This JSON does not contain a compatible merchant collection.');if(data.schemaVersion>D.SCHEMA_VERSION)throw new Error('This backup uses a newer schema and cannot be restored safely.');for(const key of ['calls','unmatched','photos','sales','credits','cases','followups','resources','links'])if(raw[key]!==undefined&&!Array.isArray(raw[key]))throw new Error('Invalid collection: '+key);const restored=normalizeState(raw);D.confirm(`Restore ${restored.merchants.length} merchants, ${restored.calls.length} calls and ${restored.followups.length} follow-ups from this backup? This replaces your current workspace.`,()=>{D.state=restored;D.saveAndRender('Portable workspace restored.');});}catch(e){D.toast(e.message,'error');}};

D.modules.Dashboard=()=>{const s=D.state.settings,today=D.today(),st=D.stats(today),active=D.active(),queue=active.filter(q=>!['Done','Blocked / Data Issue'].includes(D.classify(q))).sort((a,b)=>D.priority(b)-D.priority(a)),m=queue[0],due=D.dueFollow(),pct=Math.min(100,st.credited/(s.minuteGoal*60||1)*100),safe=active.filter(m=>D.local(m).safe).length;const week=D.weekStart(today),trend=Array.from({length:7},(_,i)=>D.stats(D.addDays(week,i)).credited/60);const best=m?(()=>{const f=D.followFor(m.id).filter(D.openFollow).sort((a,b)=>((a.date||'')+(a.time||'' )).localeCompare((b.date||'')+(b.time||'')))[0];return `<div class="spread"><div class="eyebrow">Next best action</div>${D.badge(D.insights(m).opportunity+' opportunity')}</div><h2>${D.esc(m.storeName)}</h2><p class="command-note">${D.esc(D.classify(m))} · ${D.esc(D.local(m).status)}<br>DM: ${D.esc(m.dmName||'Contact not assigned')}${f?` · Follow-up ${D.shortDate(f.date)} ${D.esc(f.time||'')}`:''}</p><div class="command-stats"><div><b>${D.money(m.gmv)}</b><span>GMV · imported</span></div><div><b>${m.photoCoverage===null||m.photoCoverage===undefined?'—':D.esc(m.photoCoverage)+'%'}</b><span>Photo coverage</span></div><div><b data-merchant-clock="${m.id}">${D.esc(D.local(m).time||'—')}</b><span>Merchant local time</span></div></div><div class="toolbar">${D.btn('Open workspace '+D.icon('arrow',14),`DW.select('${m.id}','Work Hub')`,'primary')}${D.btn(D.icon('phone',14)+' Call',`DW.external('call','${m.id}')`)}${D.btn('Merchant Portal',`DW.external('portal','${m.id}')`)}</div>`})():`<div class="eyebrow">Your next conversation starts here</div><h2>Bring your portfolio into focus.</h2><p class="command-note">Import your merchants to build a priority queue, plan follow-ups and track your day in one workspace.</p><div class="toolbar">${D.btn(D.icon('import',15)+' Import merchants',"DW.navigate('Import Center')",'primary')}${D.btn('Explore demo workspace','DW.loadDemo()')}</div><p class="small" style="color:#ffffff90;margin:18px 0 0">Demo records are fictional and can be removed in Settings.</p>`;
return `${heading('Daily overview',`Good ${new Date().getHours()<12?'morning':'afternoon'}, ${s.agentName.split(' ')[0]}.`,'A clear view of your portfolio, priorities and progress.',D.btn('Close day',"DW.closeDay()")+D.btn('Open Work Hub '+D.icon('arrow',14),"DW.navigate('Work Hub')",'primary'))}<div class="stack"><div class="grid4">${metric('Daily call target',`${D.minutes(st.credited)}<span style="font-size:13px;color:var(--muted);letter-spacing:0"> / ${s.minuteGoal} min</span>`,`${Math.max(0,s.minuteGoal-Math.round(st.credited/60))} min remaining · credited time`,'phone',pct)}${metric('Talk time',D.minutes(st.real)+'<span style="font-size:13px;color:var(--muted)"> min</span>','Real duration recorded today','clock')}${metric('Merchants called',st.merchants,`${st.calls} attempts · daily goal ${s.callGoal}`,'merchant',st.calls/(s.callGoal||1)*100)}${metric('Photos added',st.photos,`Daily photo goal ${s.photoGoal}`,'photo',st.photos/(s.photoGoal||1)*100)}</div><div class="dashboard-middle"><section class="card command-card">${best}</section><section class="card"><div class="card-head"><h3>Today at a glance</h3>${D.icon('clock')}</div><div class="glance-row"><span class="glance-label"><i class="dot" style="background:var(--good)"></i>Within calling window</span><strong>${safe} merchants</strong></div><div class="glance-row"><span class="glance-label"><i class="dot" style="background:var(--warn)"></i>Follow-ups due</span><strong>${due.length}</strong></div><div class="glance-row"><span class="glance-label"><i class="dot"></i>Merchants prioritized</span><strong>${active.length}</strong></div><div class="glance-row"><span class="glance-label"><i class="dot" style="background:var(--secondary)"></i>Photos remaining</span><strong>${Math.max(0,s.photoGoal-st.photos)}</strong></div><div class="divider"></div><div class="spread small" style="margin-bottom:9px"><span class="muted">Day completion</span><strong>${Math.round(pct)}%</strong></div>${D.bar(pct)}<div class="toolbar" s n('')}</div></section><section class="card"><div class="card-head"><div><h3>Canada operating windows</h3><span class="muted small">${D.esc(s.safeStart)}–${D.esc(s.safeEnd)} local · Monday–Friday</span></div>${D.icon('clock')}</div><div class="clock-grid">${[['Pacific','America/Vancouver'],['Mountain','America/Edmonton'],['Saskatchewan','America/Regina'],['Central','America/Winnipeg']].map(([n,tz])=>`<div class="clock-box"><div class="clock-region">${n}</div><div class="clock-time" data-clock="${tz}">—</div><div class="small" data-clock-status="${tz}" style="margin-top:6px"></div></div>`).join('')}</div><details style="margin-top:20px"><summary>Eastern, Atlantic & Newfoundland</summary><div class="row wrap">${[['Eastern','America/Toronto'],['Atlantic','America/Halifax'],['Newfoundland','America/St_Johns']].map(([n,tz])=>`<span class="pill">${n} <b data-clock="${tz}">—</b></span>`).join('')}</div></details></section></div><div class="muted small">Local workspace · GMV is imported portfolio data. Progress is calculated from the activity you record.</div></div>`};
const filterDefs={view:['Uncalled (untouched)','Called recently','Follow-up due','Photo approved','No Answer','Spoke','A-Z','All merchants'],sort:['Priority','A-Z'],localTime:['All local times','Before 10 AM','10 AM–12 PM','12 PM–2 PM','2 PM–4 PM','4 PM–6 PM','6 PM and later','No local time data'],coverage:['All photo coverage','Below 50%','50% or higher','No coverage data'],last:['All last interactions','Last interaction = Voicemail','Last interaction ≠ Voicemail','No call history'],video:['All video statuses','No video available','Had a video','Not started','In progress','In review','Rejected','Still looking','Approved','Complete','Done'],photo:['All photo statuses','Needs Photos','Pending','Approved','Rejected','Complete'],contact:['All contact statuses','Not tracked','Voicemail','Email only','GK only','Wrong number','Store closed','DM reached','Need follow-up'],phone:['All phone types','Mobile','Work Phone','Mobile + Work','Type unknown'],recall:['All recall windows','Overdue','Due today','Due in 1 day','3 days','5 days','1 week','2 weeks']};
const filterDefaults={search:'',view:'Uncalled (untouched)',sort:'Priority',market:'All markets',localTime:filterDefs.localTime[0],coverage:filterDefs.coverage[0],last:filterDefs.last[0],video:filterDefs.video[0],photo:filterDefs.photo[0],contact:filterDefs.contact[0],phone:filterDefs.phone[0],recall:filterDefs.recall[0]};

function recent(m){return D.recentlyCalled(m.id)}
D.recallInfo=m=>{if(!m.statusDate||!m.recallDays)return null;const date=D.addDays(/^\d{4}-\d{2}-\d{2}$/.test(m.statusDate)?m.statusDate:D.dateKey(m.statusDate),+m.recallDays),days=Math.round((new Date(date+'T12:00:00Z')-new Date(D.today()+'T12:00:00Z'))/86400000);return{date,days,label:days<0?`Overdue by ${-days} days`:days===0?'Call today':`${days} days left`}};
function passes(m,f,ignoreView=false){const l=D.local(m),last=D.callsFor(m.id).sort((a,b)=>b.timestamp.localeCompare(a.timestamp))[0],r=D.recallInfo(m),cov=m.photoCoverage; if(f.search&&!hubText(m).includes(f.search.toLowerCase()))return false;if(f.market!=='All markets'&&m.market!==f.market)return false;if(!ignoreView){if(f.view==='Uncalled (untouched)'&&recent(m))return false;if(f.view==='Called recently'&&!recent(m))return false;if(f.view==='Follow-up due'&&!D.dueFollow(m.id).length)return false;if(f.view==='Photo approved'&&m.photoStatus!=='Approved'&&!m.hasUsablePhotos)return false;if(['No Answer','Spoke'].includes(f.view)&&m.status!==f.view)return false}if(f.localTime==='No local time data'&&!['Missing timezone','Invalid timezone'].includes(l.status))return false;const times={'Before 10 AM':[0,10],'10 AM–12 PM':[10,12],'12 PM–2 PM':[12,14],'2 PM–4 PM':[14,16],'4 PM–6 PM':[16,18],'6 PM and later':[18,24]};if(times[f.localTime]&&(l.hour===null||l.hour===undefined||l.hour<times[f.localTime][0]||l.hour>=times[f.localTime][1]))return false;if(f.coverage==='No coverage data'&&cov!==null&&cov!==undefined)return false;if(f.coverage==='Below 50%'&&(cov===null||cov===undefined||cov>=50))return false;if(f.coverage==='50% or higher'&&(cov===null||cov===undefined||cov<50))return false;if(f.last==='No call history'&&last)return false;if(f.last==='Last interaction = Voicemail'&&(!last||!/voicemail/i.test(last.disposition)))return false;if(f.last==='Last interaction ≠ Voicemail'&&(!last||/voicemail/i.test(last.disposition)))return false;if(!f.video.startsWith('All ')&&(m.videoStatus||'No video available')!==f.video)return false;if(!f.photo.startsWith('All ')&&(m.photoStatus||'Needs Photos')!==f.photo)return false;if(!f.contact.startsWith('All ')&&(m.contactStatus||'Not tracked')!==f.contact)return false;const mob=!!m.mobilePhone||/mobile/i.test(m.phoneType||''),work=!!m.workPhone||/work/i.test(m.phoneType||'');if(f.phone==='Mobile'&&!mob)return false;if(f.phone==='Work Phone'&&!work)return false;if(f.phone==='Mobile + Work'&&!(mob&&work))return false;if(f.phone==='Type unknown'&&(mob||work))return false;if(f.recall!=='All recall windows'){if(!r)return false;const map={'Due today':0,'Due in 1 day':1,'3 days':3,'5 days':5,'1 week':7,'2 weeks':14};if(f.recall==='Overdue'&&r.days>=0)return false;if(f.recall!=='Overdue'&&r.days!==map[f.recall])return false}return true}
D.hubResults=()=>{const f={...filterDefaults,...D.state.ui.hubFilters};let a=D.active().filter(m=>passes(m,f)),fallback=false;if(!a.length&&f.view==='Uncalled (untouched)'){a=D.active().filter(m=>passes(m,f,true));fallback=a.length>0}a.sort((x,y)=>f.sort==='A-Z'||f.view==='A-Z'?x.storeName.localeCompare(y.storeName):D.priority(y)-D.priority(x));return{merchants:a,fallback,filters:f}};
D.modules['Work Hub']=()=>{const {merchants:a,fallback,filters:f}=D.hubResults(),pages=Math.max(1,Math.ceil(a.length/8)),page=Math.max(1,Math.min(pages,D.state.ui.hubPage||1));D.state.ui.hubPage=page;const list=a.slice((page-1)*8,page*8);let m=D.selected();if(!m||m.archived){m=list[0]||null;if(m)D.state.ui.selectedMerchantId=m.id}const controls=[['view','View',filterDefs.view],['sort','Sort',filterDefs.sort],['market','Market',['All markets',...Array.from(new Set(D.active().map(m=>m.market).filter(Boolean))).sort()]],['localTime','Local time',filterDefs.localTime],['coverage','Photo coverage',filterDefs.coverage],['last','Last interaction',filterDefs.last],['video','Video status',filterDefs.video],['photo','Photo status',filterDefs.photo],['contact','Contact status',filterDefs.contact],['phone','Phone type',filterDefs.phone],['recall','Recall window',filterDefs.recall]];return `${heading('Portfolio workspace','Work Hub','Focus your queue, open a merchant and keep the next action moving.',D.btn('Import CSV',"DW.navigate('Import Center')")+D.btn('New follow-up',`DW.openFollowEditor('${m?.id||''}')`,'primary'))}<div class="stack"><div class="card"><div class="spread wrap" style="margin-bottom:15px"><div class="row"><b>Smart filters</b>${D.badge(a.length+' merchants','neutral')}</div>${D.btn('Clear smart filters','DW.clearHub()','ghost small')}</div><div class="filters"><div><label for="hub-search">Search</label><input id="hub-search" placeholder="Merchant, Store ID or contact…" value="${D.esc(f.search)}" onchange="DW.hubFilter('search',this.value)"></div>${controls.map(([key,label,opts])=>`<div><label for="hub-${key}">${label}</label>${D.selectInput('hub-'+key,opts,f[key],`onchange="DW.hubFilter('${key}',this.value)"`)}</div>`).join('')}</div>${fallback?'<div class="note" style="margin-top:14px">No merchants meet the seven-day Uncalled view. Showing merchants that match your other filters.</div>':''}</div>${!D.active().length?D.empty('Your portfolio is ready for its fi       if (m.sourceUrl && !urlOK(m.sourceUrl)) errors.push('Menu Source URL is invalid.');
      if (m.sourceUrl2 && !urlOK(m.sourceUrl2)) errors.push('Menu Source URL 2 is invalid.');
      if (!txt(m.briefDescription).trim()) errors.push('Brief description of update is required.');
      if (!txt(m.completionContact).trim()) errors.push('Who To Contact When Complete is required.');
      if (m.completionEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.completionEmail)) errors.push('Completion Contact Email is invalid.');

  D.saveCase = function (event) {
    event.preventDefault();
    if (!D.caseEditing) return;
    const form = document.getElementById('case-editor-form');

    if (!form.reportValidity()) return;
    const fd = new FormData(form), c = D.caseEditing.draft;
    ['type','status','caseDate','caseUrl','externalCaseNumber','merchantName','merchantCommercialId','storeIds','marketRegion','accountManager','merchantContact','contactEmail','contactPhone','internalNotes'].forEach(k => {c[k] = txt(fd.get(k)).trim();});
    c.accountIssueCategory = c.type === 'New AM Case' ? txt(fd.get('accountIssueCategory')) : c.accountIssueCategory || '';
    if (c.type === 'New Menu Update Case') {
      ['permanence','goLiveTiming','goLiveDate','dueDate','revertDate','locationScope','locationDetails','sourceUrl','sourceUrl2','sourceNotes','briefDescription','completionContact','completionEmail'].forEach(k => {if (!form.elements[k].disabled) c.menu[k] = txt(fd.get(k)).trim();});
      ['updateTypes','updateDetails','menusAffected'].forEach(k => {c.menu[k] = fd.getAll(k).map(txt);});
      c.menu.isDdfb = fd.has('isDdfb');
    }

    if (errors.length) {document.getElementById('case-editor-error').innerHTML = errors.map(e).join('<br>');return;}
    const now = D.now(), old = getCase(c.id);
    c.updatedAt = now;
    c.history = listHistory(c.history);
    if (!old || old.status !== c.status) c.history.push({timestamp:now,from:old ? old.status : '',to:c.status,user:D.state.settings.agentName || '',note:old ? 'Status updated' : 'Case created'});

  function listHistory(value) {
    return (Array.isArray(value) ? value : []).slice(-40).filter(v => v && typeof v === 'object').map(v => ({timestamp:txt(v.timestamp),from:txt(v.from),to:txt(v.to),user:txt(v.user),note:txt(v.note)}));
  }

  D.viewCase = function (id) {
    const c = getCase(id);
    if (!c) return D.toast('Case not found.','bad');
    const menu = Object.assign(menuDefaults(),c.menu || {});
    let body = '<div class="stack"><div class="spread wrap"><div>' + D.badge(c.status,tone(c.status)) + '<p class="small muted">' + e(c.id) + '</p></div><div class="row wrap">' + button('Edit',"DW.openCaseEditor('" + c.merchantId + "','" + c.id + "')") + button('Link',"DW.openCaseLink('" + c.id + "')",'primary') + '</div></div><div class="card"><h3>Case information</h3><div class="fields">' + row('Type Of Case',c.type) + row('Status',c.status) + row('Case date',c.caseDate) + row('External Case Number',c.externalCaseNumber) + row('URL / Link of the case',c.caseUrl) + row('Created',c.createdAt) + row('Last updated',c.updatedAt) + '</div></div><div class="card"><h3>Merchant information</h3><div class="fields">' + [['Merchant Name','merchantName'],['Merchant ID','merchantCommercialId'],['Store ID(s)','storeIds'],['Market / Region','marketRegion'],['Account Manager','accountManager'],['Merchant Contact','merchantContact'],['Contact Email','contactEmail'],['Contact Phone','contactPhone'],['Internal notes','internalNotes']].map(([label,k]) => row(label,c[k])).join('') + '</div></div>';
    if (c.type === 'New AM Case') body += '<div class="card"><h3>New AM Case</h3>' + row('Account Issue Category',c.accountIssueCategory) + '</div>';
    if (c.type === 'New Menu Update Case') body += '<div class="card"><h3>Dates and scope</h3><div class="fields">' + row('Temporary or Permanent?',menu.permanence) + row('When Should Changes Go Live?',menu.goLiveTiming) + (menu.goLiveTiming === 'Future Date' ? row('Go Live Date',menu.goLiveDate) + row('Due Date',menu.dueDate) : '') + (menu.permanence === 'Temporary' ? row('Date to Revert Changes',menu.revertDate) : '') + row('Single/Multi Location Update?',menu.locationScope) + (menu.locationScope !== 'All Stores' ? row('Location / Store ID details',menu.locationDetails) : '') + row('This is a DDFB menu',menu.isDdfb ? 'Yes' : 'No') + row('Type of Update',list(menu.updateTypes).join(', ')) + row('Update Details',list(menu.updateDetails).join(', ')) + row('Menu(s) Affected',list(menu.menusAffected).join(', ')) + '</div></div><div class="card"><h3>Menu Source Updates</h3><div class="fields">' + row('Menu Source URL',menu.sourceUrl) + row('Menu Source URL 2',menu.sourceUrl2) + row('Menu Source Notes',menu.sourceNotes) + row('Brief description of update',menu.briefDescription) + '</div></div><div class="card"><h3>Closing Information</h3><div class="fields">' + row('Who To Contact When Complete',menu.completionContact) + row('Completion Contact Email',menu.completionEmail) + '</div></div>';

  D.exportCases = function (merchantId,format) {

    else {
      const keys = ['id','merchantId','type','status','caseDate','caseUrl','externalCaseNumber','merchantName','merchantCommercialId','storeIds','marketRegion','accountManager','merchantContact','contactEmail','contactPhone','accountIssueCategory','internalNotes','createdAt','updatedAt','menu','attachments','history'];
      D.download(name + '.csv',D.csv([keys].concat(cases.map(c => keys.map(k => typeof c[k] === 'object' ? JSON.stringify(c[k]) : txt(c[k]))))),'text/csv;charset=utf-8');

  D.normalizeCase = function (raw,merchantId) {
    const m = D.merchant(merchantId);
    if (!m || !raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('Invalid case record.');
    const c = caseDefaults(m);
    c.id = cleanId(raw.id || D.uid());
    ['type','status','caseDate','caseUrl','externalCaseNumber','merchantName','merchantCommercialId','storeIds','marketRegion','accountManager','merchantContact','contactEmail','contactPhone','internalNotes','accountIssueCategory'].forEach(k => {if (raw[k] != null) c[k] = txt(raw[k]).trim();});
    c.merchantId = merchantId;
    const rm = raw.menu && typeof raw.menu === 'object' && !Array.isArray(raw.menu) ? raw.menu : {};
    Object.keys(c.menu).forEach(k => {if (rm[k] != null) c.menu[k] = ['updateTypes','updateDetails','menusAffected'].includes(k) ? list(rm[k]) : k === 'isDdfb' ? rm[k] === true : txt(rm[k]);});
    c.attachments = (Array.isArray(raw.attachments) ? raw.attachments : []).filter(a => a && typeof a === 'object').map(a => ({name:txt(a.name),size:Math.max(0,Number(a.size) || 0),type:txt(a.type),lastModified:Number(a.lastModified) || 0}));
    c.history = listHistory(raw.history);
    ['createdAt','updatedAt'].forEach(k => {if (raw[k] && !Number.isNaN(Date.parse(raw[k]))) c[k] = new Date(raw[k]).toISOString();});
    const errors = D.validateCase(c,true);
    if (errors.length) throw new Error(errors.join(' '));
    return c;
  };

  D.importCases = async function (event,merchantId) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    event.target.value = '';
    if (file.size > 20 * 1024 * 1024) return D.toast('Choose a JSON file smaller than 20 MB.','warn');
    try {
      const payload = JSON.parse(await file.text());
      const rows = Array.isArray(payload) ? payload : payload && Array.isArray(payload.cases) ? payload.cases : null;
      if (!rows) throw new Error('Expected a JSON array of cases or an object containing a cases array.');
      const valid = [], failures = [];
      rows.forEach((raw,i) => {
        try {
          const c = D.normalizeCase(raw,merchantId);
          if (records().some(other => other.id === c.id && other.merchantId !== merchantId)) c.id = D.uid();
          valid.push(c);
        } catch (err) {failures.push('Record ' + (i + 1) + ': ' + err.message);}
      });
      let created = 0, updated = 0;
      valid.forEach(c => {
        const old = getCase(c.id);
        if (old) {
          const seen = new Set();
          c.history = (old.history || []).concat(c.history || []).filter(h => {const key = JSON.stringify(h);if (seen.has(key)) return false;seen.add(key);return true;}).sort((a,b) => txt(a.timestamp).localeCompare(txt(b.timestamp)));
          if (old.status !== c.status) c.history.push({timestamp:D.now(),from:old.status,to:c.status,user:D.state.settings.agentName || '',note:'Status updated by JSON import'});
          c.history = listHistory(c.history);
          c.createdAt = old.createdAt || c.createdAt;
          c.updatedAt = D.now();
          records().splice(records().indexOf(old),1,c);updated++;

          if (!c.history.length) c.history.push({timestamp:D.now(),from:'',to:c.status,user:D.state.settings.agentName || '',note:'Case imported'});
          records().push(c);created++;
        }
      });
      D.saveAndRender(created + ' cases imported · ' + updated + ' updated' + (failures.length ? ' · ' + failures.length + ' rejected.' : '.'));
      if (failures.length) D.modal('Case import results','<p>' + created + ' imported, ' + updated + ' updated, ' + failures.length + ' rejected.</p><p class="muted small">Rejected records were not saved.</p><div class="stack">' + failures.slice(0,100).map(message => '<p class="small">' + e(message) + '</p>').join('') + '</div>',true);
    } catch (err) {D.toast('Case import failed: ' + err.message,'bad');}
  };
})();

D.dailyCloseText=function(date){date=date||D.today();const rows=summaryRows(date);return 'DASHWORK DAILY CLOSE — '+date+'\n\n'+rows.slice(1,-1).map(([label,value])=>label+': '+(label==='GMV touched'?D.money(value):value)).join('\n')+'\n\nMerchants at risk\n'+(atRisk().map((m,i)=>(i+1)+'. '+(m.storeName||m.storeId||'Unnamed merchant')+' — '+D.classify(m)+(m.storeId?' · Store ID '+m.storeId:'')).join('\n')||'No merchants meet the local risk rules.')+'\n\nGMV touched is imported GMV of the distinct stores worked, not sales generated by this activity. Risk classifications use local workspace rules, not an official churn assessment.';};
D.closeDay=function(date){date=date||D.today();D.modal('Close day', '<div class="row spread wrap"><div><p class="eyebrow">DAILY OPERATING SUMMARY</p><h2>'+e(dateText(date))+'</h2></div>'+D.badge('Editable summary','info')+'</div><p class="muted small">Review or edit the text before copying or downloading. CSV preserves the structured metrics for this date.</p><label class="field full"><span>Daily close summary</span><textarea id="dailyCloseText" rows="19" style="min-height:360px">'+e(D.dailyCloseText(date))+'</textarea></label><div class="row wrap" style="margin-top:18px">'+D.btn('Copy summary','DW.copy(document.getElementById(\'dailyCloseText\').value)','primary')+D.btn('Download TXT','DW.download(\'DASHWORK_DAILY_CLOSE_'+date+'.txt\',document.getElementById(\'dailyCloseText\').value,\'text/plain\')')+D.btn('Download CSV','DW.exportActivity(\'day-csv\','+JSON.stringify(date)+')')+'</div>',true);};
const activityHeaders=['Date','Credited','Real','Calls','Photos','Stores','Follow-ups created','Follow-ups completed','GMV touched'];
function activityCSV(dates){return D.csv([activityHeaders,...dates.map(d=>{const s=stats(d);return [d,D.minutes(s.credited),D.minutes(s.real),s.calls,s.photos,s.stores,s.followCreated,s.followCompleted,s.gmv];})]);}
D.exportActivity=function(kind,date){date=date||activityDate();if(kind==='day-txt'){D.download('DASHWORK_DAILY_CLOSE_'+date+'.txt',D.dailyCloseText(date),'text/plain');return;}if(kind==='day-csv'){D.download('DASHWORK_DAILY_CLOSE_'+date+'.csv',D.csv([['Metric','Value'],...summaryRows(date)]),'text/csv');return;}if(kind==='week-csv'){const first=D.weekStart(date);D.download('DASHWORK_Activity_Week_'+first+'.csv',activityCSV(Array.from({length:7},(_,i)=>D.addDays(first,i))),'text/csv');return;}const month=D.state.ui.activityMonth||date.slice(0,7);D.download('DASHWORK_Activity_'+month+'.csv',activityCSV(datesInMonth(month)),'text/csv');};
D.activityChoose=function(date){D.state.ui.activityDate=date;D.state.ui.activityMonth=date.slice(0,7);D.state.ui.activityPage=1;D.saveAndRender();};
D.activityMonth=function(delta){activityDate();const month=D.state.ui.activityMonth;const d=new Date(month+'-01T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+number(delta));D.state.ui.activityMonth=d.toISOString().slice(0,7);D.state.ui.activityPage=1;D.saveAndRender();};
D.activityPage=function(page){D.state.ui.activityPage=Math.max(1,number(page));D.saveAndRender();};
function pagination(page,count,callback){if(count<=1)return '';const start=Math.max(1,Math.min(page-2,count-4));const end=Math.min(count,start+4);let b='';const button=(label,p,disabled,active)=>'<button class="btn small '+(active?'primary':'')+'" '+(disabled?'disabled':'')+' onclick="DW.'+callback+'('+p+')">'+label+'</button>';b+=button('«',1,page===1);b+=button('‹',page-1,page===1);for(let i=start;i<=end;i++)b+=button(i,i,false,i===page);b+=button('›',page+1,page===count);b+=button('»',count,page===count);return '<nav class="row wrap" aria-label="Pagination">'+b+'</nav>';}
function goalCard(label,value,goal,unit){const goalValue=unit==='min'?value/60:value;const progress=goal>0?Math.min(100,Math.max(0,goalValue/goal*100)):0;return '<div class="metric"><span class="muted small">'+e(label)+'</span><div class="metric-value">'+e(unit==='min'?D.minutes(value):value)+'<span class="muted small"> / '+e(goal)+(unit?' '+unit:'')+'</span></div>'+D.bar(progress)+'<div class="muted small" style="margin-top:7px">'+Math.round(progress)+'% of daily goal</div></div>';}
function statTile(label,value,sub){return '<div class="metric"><span class="muted small">'+e(label)+'</span><div class="metric-value">'+e(value)+'</div>'+(sub?'<span class="muted small">'+e(sub)+'</span>':'')+'</div>';}
function statsTable(dates,selectable){return D.table(['Date','Credited','Real','Calls','Photos','Stores','Follow-ups','GMV touched'],dates.map(d=>{const s=stats(d);return [selectable?'<button class="btn ghost small" onclick="DW.activityChoose('+arg(d)+')">'+e(dateText(d))+'</button>':e(dateText(d)),e(duration(s.credited)),e(duration(s.real)),e(s.calls),e(s.photos),e(s.stores),e(s.followCreated+' created / '+s.followCompleted+' completed'),e(D.money(s.gmv))];}));}
D.modules.Activity=function(){
const date=activityDate(),month=D.state.ui.activityMonth,monthDates=datesInMonth(month),selected=stats(date),settings=D.state.settings,monthName=new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(month+'-01T12:00:00Z'));const offset=(new Date(month+'-01T12:00:00Z').getUTCDay()+6)%7;const today=D.today();let cal=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<div class="calendar-head small muted" style="text-align:center;padding:8px">'+x+'</div>').join('');cal+=Array.from({length:offset},()=>'<div class="calendar-cell" style="min-height:98px;border-radius:8px" aria-hidden="true"></div>').join('');monthDates.forEach(d=>{const s=stats(d),goal=number(settings.minuteGoal),percent=goal>0?Math.min(100,s.credited/(goal*60)*100):0;cal+='<button class="calendar-cell activity-day '+(d===date?'selected ':'')+(d===today?'today':'')+'" style="cursor:pointer;text-align:left;min-height:98px;border:1px solid var(--line);border-radius:8px;color:var(--text);'+(d===date?'border-color:var(--accent);background:var(--soft);':'')+'" aria-pressed="'+(d===date)+'" onclick="DW.activityChoose('+arg(d)+')"><div class="row spread"><strong>'+Number(d.slice(8))+'</strong>'+(d===today?'<span class="badge info" style="font-size:10px">Today</span>':'')+'</div><div class="small" style="margin:7px 0">'+e(duration(s.credited))+'</div>'+D.bar(percent)+'<div class="muted small" style="margin-top:7px">'+s.calls+' calls · '+s.photos+' photos</div></button>';});
const weekStart=D.weekStart(date),weekDates=Array.from({length:7},(_,i)=>D.addDays(weekStart,i)),weekSum=weekDates.map(stats).reduce((a,s)=>{['credited','real','calls','photos'].forEach(k=>a[k]+=s[k]);return a;},{credited:0,real:0,calls:0,photos:0});const pageCount=Math.ceil(monthDates.length/8),page=Math.max(1,Math.min(number(D.state.ui.activityPage)||1,pageCount));D.state.ui.activityPage=page;const rows=monthDates.slice((page-1)*8,page*8);

SUNDAY</p><h2>Week of '+e(dateText(weekStart))+'</h2></div>'+D.btn('Download CSV','DW.exportActivity(\'week-csv\','+JSON.stringify(date)+')')+'</div><div class="grid4" style="margin-bottom:18px">'+statTile('Credited',duration(weekSum.credited))+statTile('Real',duration(weekSum.real))+statTile('Call attempts',weekSum.calls)+statTile('Photos added',weekSum.photos)+'</div>'+statsTable(weekDates,true)+'</div><div class="card"><div class="card-head row spread wrap"><div><p class="eyebrow">MONTHLY LEDGER</p><h2>Every day accounted for</h2></div><span class="muted small">'+monthDates.length+' days · page '+page+' of '+pageCount+'</span></div>'+statsTable(rows,true)+'<div class="row spread wrap" style="margin-top:16px">'+pagination(page,pageCount,'activityPage')+'<span class="muted small">GMV touched counts each store once per day.</span></div></div></div>';
};
const logSets={Calls:'calls',Photos:'photos',Sales:'sales',Credits:'credits',Unmatched:'unmatched'};
D.logsTab=function(tab){if(!logSets[tab])return;D.state.ui.logsTab=tab;D.state.ui.logsPage=1;D.saveAndRender();};
D.logsPage=function(page){D.state.ui.logsPage=Math.max(1,number(page));D.saveAndRender();};
D.logsDelete=function(key,id){if(!Object.values(logSets).includes(key))return;D.confirm('Delete this '+(key==='unmatched'?'unmatched call':key.replace(/s$/,''))+' entry? This will update the activity totals.',()=>{D.state[key]=D.state[key].filter(x=>x.id!==id);D.saveAndRender('Entry deleted');});};
D.logsClear=function(){const tab=D.state.ui.logsTab||'Calls',key=logSets[tab];if(!key)return;const n=D.state[key].length;D.confirm('Clear all '+n+' entries in '+tab+'? This removes the complete collection, including entries on other pages.',()=>{D.state[key]=[];D.state.ui.logsPage=1;D.saveAndRender(tab+' cleared');});};
D.assignUnmatched=function(id,merchantId){const found=D.state.unmatched.find(x=>x.id===id),merchant=D.merchant(merchantId);if(!found||!merchant){D.toast('Choose a merchant before assigning this call.','error');return;}const source=found.call&&typeof found.call==='object'?found.call:found;const call=Object.assign({},source,{id:source.id||found.id||D.uid(),merchantId:merchant.id,matchMethod:'manual review',matchConfidence:100});delete call.suggestions;delete call.suggestedMerchantIds;delete call.call;const existing=D.state.calls.findIndex(x=>x.id===call.id);if(existing>=0)D.state.calls[existing]=call;else D.state.calls.push(call);D.state.calls.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));D.state.unmatched=D.state.unmatched.filter(x=>x.id!==id);D.saveAndRender('Call assigned to '+merchantName(merchant.id));};
D.logsExport=function(){const tab=D.state.ui.logsTab||'Calls',key=logSets[tab];const rows=D.state[key]||[];let headers,fields;if(key==='calls'||key==='unmatched'){headers=['Date','Merchant','Store ID','State','Disposition','Real Seconds','Credited Seconds','Source','Note','Prospect Name','Prospect Company','Match Method','Match Confidence','Direction','From','To','Phone','Purpose','User'];fields=x=>{x=x.call||x;return [x.timestamp,merchantName(x.merchantId),(D.merchant(x.merchantId)||{}).storeId||'',x.state,x.disposition,x.realSeconds,x.creditedSeconds,x.source,x.note,x.prospectName,x.prospectCompany,x.matchMethod,x.matchConfidence,x.direction,x.from,x.to,x.phone,x.purpose,x.user];};}else if(key==='photos'){headers=['Date','Merchant','Photos','Coverage Before','Coverage After','Missing Before','Status','Source','Note','User'];fields=x=>[x.timestamp,merchantName(x.merchantId),x.photosAdded,x.coverageBefore,x.coverageAfter,x.missingBefore,x.status,x.source,x.note,x.user];}else if(key==='sales'){headers=['Date','Merchant','Type','Campaign','Status','Commercial Status','Start Date','End Date','Reference','Note','User'];fields=x=>[x.timestamp,merchantName(x.merchantId),x.promoType,x.campaign,x.status,x.commercialStatus,x.startDate,x.endDate,x.reference,x.note,x.user];}else{headers=['Date','Merchant','Amount','Type','Status','Reference','Note','User'];fields=x=>[x.timestamp,merchantName(x.merchantId),x.amount,x.type,x.status,x.reference,x.note,x.user];}D.download('DASHWORK_'+tab+'_'+D.today()+'.csv',D.csv([headers,...rows.map(fields)]),'text/csv');};
function suggestions(record){let candidates=record.suggestions||record.suggestedMerchantIds||record.matches||[];if(!Array.isArray(candidates))candidates=[];return candidates.map(x=>typeof x==='string'?{merchantId:x}:x).map(x=>({merchantId:x.merchantId||x.id||x.merchant?.id,confidence:x.confidence??x.score??x.matchConfidence})).filter(x=>D.merchant(x.merchantId)).slice(0,5);}
function unmatchedCards(records){return records.map(r=>{const x=r.call||r,id=r.id;const sug=suggestions(r);const options=[['','Choose merchant'],...D.active().sort((a,b)=>merchantName(a.id).localeCompare(merchantName(b.id))).map(m=>[m.id,(m.storeName||'Unnamed merchant')+' · '+(m.storeId||'No Store ID')])];return '<article class="card"><div class="row spread wrap"><div><p class="eyebrow">'+e(stamp(x.timestamp))+'</p><h3>'+e(x.prospectName||x.prospectCompany||x.phone||'Unmatched call')+'</h3></div>'+D.badge(x.state||'Unmatched','warn')+'</div><div class="grid3" style="margin:14px 0"><div><span class="muted small">Company / prospect</span><p>'+e(x.prospectCompany||'—')+' / '+e(x.prospectName||'—')+'</p></div><div><span class="muted small">Phone · From → To</span><p>'+e(x.phone||'—')+' · '+e(x.from||'—')+' → '+e(x.to||'—')+'</p></div><div><span class="muted small">Real / Credited · Disposition</span><p>'+e(duration(x.realSeconds))+' / '+e(duration(x.creditedSeconds))+' · '+e(x.disposition||'—')+'</p></div></div><div class="small muted">'+e(x.source||'Imported')+' · '+e(x.user||'Unknown user')+' · '+e(x.direction||'Direction unknown')+'</div><p class="small" style="white-space:pre-wrap">'+e(x.note||'No note recorded.')+'</p><div class="fields">'+D.field('Assign merchant',D.selectInput('assignMerchant',options,'','id="assign-'+e(id)+'"'))+'<div class="row" style="align-self:end">'+D.btn('Assign call','DW.assignUnmatched('+JSON.stringify(id)+',document.getElementById('+JSON.stringify('assign-'+id)+').value)','primary')+D.btn('Delete','DW.logsDelete(\'unmatched\','+JSON.stringify(id)+')','danger')+'</div></div><div style="margin-top:12px"><span class="muted small">Suggested associations</span><div class="row wrap" style="margin-top:7px">'+(sug.length?sug.map(m=>'<button class="btn small" onclick="DW.assignUnmatched('+arg(id)+','+arg(m.merchantId)+')">'+e(merchantName(m.merchantId))+(m.confidence!=null?' · '+e(m.confidence)+'%':'')+'</button>').join(''):'<span class="muted small">No confident suggestions. Review the call and choose a merchant above.</span>')+'</div></div></article>';}).join('');}
D.modules.Logs=function(){const tab=logSets[D.state.ui.logsTab]?D.state.ui.logsTab:'Calls',key=logSets[tab],all=[...(D.state[key]||[])].sort((a,b)=>new Date((b.call||b).timestamp)-new Date((a.call||a).timestamp)),pageCount=Math.max(1,Math.ceil(all.length/12)),page=Math.max(1,Math.min(number(D.state.ui.logsPage)||1,pageCount));D.state.ui.logsPage=page;const entries=all.slice((page-1)*12,page*12);let content;if(!all.length)content=D.empty('No '+tab.toLowerCase()+' yet',tab==='Unmatched'?'Imported calls that cannot be linked confidently will appear here for manual review.':'Your saved activity appears here with its complete history.');else if(tab==='Unmatched')content=unmatchedCards(entries);else{let headers,rows;const action=x=>D.btn('Delete','DW.logsDelete('+JSON.stringify(key)+','+JSON.stringify(x.id)+')','danger small');const note=x=>'<span class="small" style="white-space:pre-wrap">'+e(x.note||'—')+'</span>';if(tab==='Calls'){headers=['Date','Merchant','State','Disposition','Real','Credited','Source','Note','Actions'];rows=entries.map(x=>[e(stamp(x.timestamp)),merchantCell(x.merchantId),D.badge(x.state||'—',x.state==='Completed'?'good':'warn'),e(x.disposition||'—'),e(duration(x.realSeconds)),e(duration(x.creditedSeconds)),e(x.source||'—'),note(x),action(x)]);}else if(tab==='Photos'){headers=['Date','Merchant','Photos','Coverage','Status','Source','Note','User','Actions'];rows=entries.map(x=>[e(stamp(x.timestamp)),merchantCell(x.merchantId),e(x.photosAdded),e((x.coverageBefore==null?'—':x.coverageBefore+'%')+' → '+(x.coverageAfter==null?'—':x.coverageAfter+'%')),D.badge(x.status||'—'),e(x.source||'—'),note(x),e(x.user||'—'),action(x)]);}else if(tab==='Sales'){headers=['Date','Merchant','Type','Campaign','Status','Period','Reference','Note','Actions'];rows=entries.map(x=>[e(stamp(x.timestamp)),merchantCell(x.merchantId),e(x.promoType||'—'),e(x.campaign||'—'),D.badge(x.status||'—'),e((x.startDate||'—')+' → '+(x.endDate||'—')),e(x.reference||'—'),note(x),action(x)]);}else{headers=['Date','Merchant','Amount','Type','Status','Reference','Note','Actions'];rows=entries.map(x=>[e(stamp(x.timestamp)),merchantCell(x.merchantId),e(D.money(x.amount)),e(x.type||'—'),D.badge(x.status||'—'),e(x.reference||'—'),note(x),action(x)]);}content='<div class="card">'+D.table(headers,rows)+'</div>';}

function catalogKey(kind){return kind==='Resources'?'resources':'links';}
function catalogState(kind){const key=kind==='Resources'?'resourceFilters':'linkFilters';return D.state.ui[key]||(D.state.ui[key]={search:'',group:'',sort:'Favorites first'});}
D.catalogFilter=function(kind,field,value){const state=catalogState(kind);state[field]=String(value);D.saveAndRender();};
D.catalogClear=function(kind){const key=kind==='Resources'?'resourceFilters':'linkFilters';D.state.ui[key]={search:'',group:'',sort:'Favorites first'};D.saveAndRender();};
D.catalogPin=function(kind,id){const x=D.state[catalogKey(kind)].find(x=>x.id===id);if(!x)return;x.pinned=!x.pinned;D.saveAndRender(x.pinned?'Pinned to favorites':'Removed from favorites');};
D.catalogDelete=function(kind,id){const key=catalogKey(kind),x=D.state[key].find(x=>x.id===id);if(!x)return;D.confirm('Delete '+x.name+' from '+kind+'?',()=>{D.state[key]=D.state[key].filter(x=>x.id!==id);D.saveAndRender('Deleted');});};

D.catalogOpen=function(kind,id){const item=D.state[catalogKey(kind)].find(x=>x.id===id);if(!item)return;if(!item.url||!validURL(item.url)){D.toast('Add a valid HTTP or HTTPS URL to this entry first.','warning');D.catalogEdit(kind,id);return;}if(kind==='Links'){item.useCount=number(item.useCount??item.uses)+1;item.uses=item.useCount;item.lastOpenedAt=D.now();item.lastOpened=item.lastOpenedAt;D.saveAndRender();}D.open(item.url);};
D.catalogCopy=function(kind,id){const item=D.state[catalogKey(kind)].find(x=>x.id===id);if(!item)return;if(!item.url){D.toast('This entry needs its URL. Open Edit to add it.','warning');return;}D.copy(item.url);};
D.catalogEdit=function(kind,id){const resource=kind==='Resources',key=catalogKey(kind),x=D.state[key].find(x=>x.id===id)||{},fresh=!x.id;const common=D.field('Name',D.input('name',x.name||'','text','required maxlength="180"'))+D.field(resource?'Emoji':'Icon',D.input(resource?'emoji':'icon',x.emoji||x.icon||(resource?'✦':'↗'),'text','maxlength="12"'))+D.field(resource?'Collection':'Category',D.input(resource?'collection':'category',x.collection||x.category||(resource?'GPT':'Systems'),'text','required maxlength="100"'));
D.modal(fresh?(resource?'New resource':'New link'):'Edit '+(resource?'resource':'link'),'<form id="catalogForm" onsubmit="event.preventDefault();DW.catalogSave('+arg(kind)+','+arg(x.id||'')+',this)"><div class="fields">'+common+(resource?D.field('Access level',D.input('accessLevel',x.accessLevel||x.access||'Anyone at DoorDash (with link)','text','maxlength="180"'))+D.field('Creator',D.input('creator',x.creator||'','text','maxlength="160"')):D.field('Validation',D.selectInput('validation',['Ready','Needs review'],x.validation||'Needs review')))+D.field('URL',D.input('url',x.url||'','url','placeholder="https://…"'),true)+D.field('Description',D.textarea('description',x.description||'','rows="4" maxlength="4000"'),true)+'</div><p class="small muted">'+(resource?'Access labels describe the resource. The external service controls actual permissions.':'Ready confirms that you reviewed this destination. An entry without a URL remains Needs review.')+'</p><div class="row wrap"><button type="submit" class="btn primary">Save</button>'+D.btn('Cancel','DW.closeModal()')+(fresh?'':D.btn('Delete','DW.closeModal();DW.catalogDelete('+JSON.stringify(kind)+','+JSON.stringify(x.id)+')','danger'))+'</div></form>',true);};
D.catalogSave=function(kind,id,form){const values=D.readForm(form),key=catalogKey(kind),existing=D.state[key].find(x=>x.id===id),name=String(values.name||'').trim(),url=String(values.url||'').trim();if(!name){D.toast('Enter a name.','error');return;}if(url&&!validURL(url)){D.toast('Use a complete HTTP or HTTPS URL.','error');return;}const record=Object.assign({},existing||{id:D.uid(),pinned:false,useCount:0,lastOpenedAt:''},values,{name,url,updatedAt:D.now()});if(kind==='Resources'){record.collection=String(record.collection||'GPT').trim();record.accessLevel=String(record.accessLevel||'').trim();record.access=record.accessLevel;record.emoji=String(record.emoji||'✦').trim();}else{record.category=String(record.category||'Systems').trim();record.validation=url&&record.validation==='Ready'?'Ready':'Needs review';record.icon=String(record.icon||'↗').trim();}if(existing)Object.assign(existing,record);else D.state[key].push(record);D.closeModal();D.saveAndRender(kind==='Resources'?'Resource saved':'Link saved');};
function renderCatalog(kind){const resource=kind==='Resources',key=catalogKey(kind),groupKey=resource?'collection':'category',filter=catalogState(kind),all=D.state[key]||[],groups=[...new Set(all.map(x=>x[groupKey]||'Other'))].sort((a,b)=>a.localeCompare(b));const query=(filter.search||'').toLowerCase().trim();let list=all.filter(x=>(!filter.group||(x[groupKey]||'Other')===filter.group)&&(!query||[x.name,x.description,x.creator,x.category,x.collection,x.accessLevel,x.access,x.url].join(' ').toLowerCase().includes(query)));const sort=filter.sort||'Favorites first';list.sort((a,b)=>{if(sort==='Favorites first'&&Boolean(a.pinned)!==Boolean(b.pinned))return a.pinned?-1:1;if(sort==='Collection'){const c=(a.collection||'').localeCompare(b.collection||'');if(c)return c;}if(sort==='Recently opened'){const c=new Date(b.lastOpenedAt||b.lastOpened||0)-new Date(a.lastOpenedAt||a.lastOpened||0);if(c)return c;}if(sort==='Most used'){const c=number(b.useCount??b.uses)-number(a.useCount??a.uses);if(c)return c;}return (a.name||'').localeCompare(b.name||'');});
const filters='<div class="card"><div class="filters row wrap">'+D.field('Search',D.input('catalogSearch',filter.search||'','search','placeholder="Search '+(resource?'resources':'links')+'…" oninput="DW.catalogSearchTyping('+arg(kind)+',this.value)" id="catalogSearch"'))+D.field(resource?'Collection':'Category',D.selectInput('catalogGroup',[['','All '+(resource?'collections':'categories')],...groups.map(g=>[g,g])],filter.group||'','onchange="DW.catalogFilter('+arg(kind)+',\'group\',this.value)"'))+D.field('Sort',D.selectInput('catalogSort',resource?['Favorites first','Name','Collection']:['Favorites first','Recently opened','Most used'],sort,'onchange="DW.catalogFilter('+arg(kind)+',\'sort\',this.value)"'))+'<div style="align-self:end">'+D.btn('Clear','DW.catalogClear('+JSON.stringify(kind)+')')+'</div></div></div>';
const cards=list.map(x=>'<article class="card stack" style="position:relative"><div class="row spread"><span style="font-size:28px" aria-hidden="true">'+e(resource?x.emoji||'✦':x.icon||'↗')+'</span>'+D.btn(x.pinned?'★ Unpin':'☆ Pin','DW.catalogPin('+JSON.stringify(kind)+','+JSON.stringify(x.id)+')','ghost small')+'</div><div><div class="row wrap" style="margin-bottom:8px">'+D.badge(x[groupKey]||'Other','info')+(!x.url?D.badge('Needs review','warn'):!resource?D.badge(x.validation||'Needs review',x.validation==='Ready'?'good':'warn'):'')+'</div><h3>'+e(x.name)+'</h3><p class="muted small" style="min-height:43px;line-height:1.6">'+e(x.description||'No description yet.')+'</p></div>'+(resource?'<div class="small"><strong>'+e(x.creator||'Creator not specified')+'</strong><p class="muted small">'+e(x.accessLevel||x.access||'Access not specified')+'</p></div>':'<div class="small muted">'+number(x.useCount??x.uses)+' opens · '+(x.lastOpenedAt||x.lastOpened?'Last '+e(stamp(x.lastOpenedAt||x.lastOpened)):'Not opened yet')+'</div>')+'<div class="row wrap" style="margin-top:auto">'+D.btn('Open','DW.catalogOpen('+JSON.stringify(kind)+','+JSON.stringify(x.id)+')','primary small')+D.btn('Copy','DW.catalogCopy('+JSON.stringify(kind)+','+JSON.stringify(x.id)+')','small')+D.btn('Edit','DW.catalogEdit('+JSON.stringify(kind)+','+JSON.stringify(x.id)+')','ghost small')+D.btn('Delete','DW.catalogDelete('+JSON.stringify(kind)+','+JSON.stringify(x.id)+')','danger small')+'</div></article>').join('');
return '<div class="stack"><div class="row spread wrap"><div><p class="eyebrow">'+(resource?'YOUR TOOLKIT':'QUICK ACCESS')+'</p><h1>'+kind+'</h1><p class="muted">'+(resource?'A curated workspace for assistants and operational resources.':'Systems, guides, forms, and tools. Keep the destinations you use close.')+'</p></div>'+D.btn(resource?'New resource':'New link','DW.catalogEdit('+JSON.stringify(kind)+')','primary')+'</div>'+filters+'<div class="row spread wrap"><span class="muted small">'+list.length+' of '+all.length+' '+(resource?'resources':'links')+' · '+all.filter(x=>x.pinned).length+' favorites</span><span class="muted small">'+(resource?'External GPTs open in their own service.':'Opening a link records a local use count and timestamp.')+'</span></div>'+(list.length?'<div class="grid3">'+cards+'</div>':D.empty('No matches','Clear the filters or add a new '+(resource?'resource':'link')+'.',D.btn('Clear filters','DW.catalogClear('+JSON.stringify(kind)+')')))+(all.some(x=>!x.url)?'<div class="card"><p class="small muted">The document provides names and descriptions without destination URLs. Select <strong>Edit</strong> to add your verified links. Entries without URLs show <strong>Needs review</strong>.</p></div>':'')+'</div>';
}
let catalogSearchTimer;
D.catalogSearchTyping=function(kind,value){const state=catalogState(kind);state.search=value;clearTimeout(catalogSearchTimer);catalogSearchTimer=setTimeout(()=>{D.saveAndRender();const input=document.getElementById('catalogSearch');if(input){input.focus();input.setSelectionRange(value.length,value.length);}},180);};
D.modules.Resources=()=>renderCatalog('Resources');
D.modules.Links=()=>renderCatalog('Links');
})();

(async()=>{const app=document.getElementById('app');try{DW.render();app.inert=true;await DW.init();DW.initShell();DW.render();window.loadDemo=DW.loadDemo;}catch(error){try{DW.initShell();DW.render();DW.toast('El navegador no pudo cargar los datos guardados. Puedes importar tu respaldo JSON desde Settings.','error');}catch(renderError){document.getElementById('content').innerHTML='<div class="card"><h1>Dashwork</h1><p>Descarga el archivo y ábrelo en Chrome o Edge para ejecutar sus funciones.</p><button class="btn" onclick="location.reload()">Volver a abrir</button></div>';}console.error(error);}finally{app.inert=false;}})();
</script></body></html>
