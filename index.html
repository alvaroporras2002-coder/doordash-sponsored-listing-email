<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoorDash Sponsored Listings</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f7f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: min(1100px, 100%);
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .header {
      background: #eb1700;
      color: white;
      padding: 22px 28px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .video-wrap {
      background: #111;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 75vh;
      background: #111;
    }

    .content {
      padding: 28px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.05;
      letter-spacing: -1px;
    }

    p {
      margin: 0 auto 22px;
      max-width: 720px;
      font-size: 18px;
      line-height: 1.5;
      color: #555;
    }

    .cta {
      display: inline-block;
      background: #eb1700;
      color: #fff;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 999px;
      font-weight: 800;
    }

    .cta:hover {
      opacity: 0.92;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="header">
      DOORDASH
    </div>

    <div class="video-wrap">
      <video
        autoplay
        muted
        playsinline
        controls
        poster="sponsored-listing-poster.jpg"
        preload="auto"
      >
        <source
          src="Untitled Workflow_generateVideo-6r1a7157d1d2 (4) (1).mp4"
          type="video/mp4"
        >
        Your browser does not support HTML5 video.
      </video>
    </div>

    <section class="content">
      <h1>Get more visibility on DoorDash</h1>

      <p>
        Sponsored Listings can help put your restaurant in front of more
        DoorDash customers when they're ready to order.
      </p>

      <a
        class="cta"
        href="#"
      >
        START YOUR SPONSORED LISTING
      </a>
    </section>

  </main>

</body>
</html>
